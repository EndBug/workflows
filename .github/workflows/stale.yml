name: 'Handle stale issues and PR'
on:
  workflow_call

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # actions/stale cannot exempt authors. Label Dependabot PRs so the step below skips them.
      - name: Exempt Dependabot pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const exemptLabel = 'dependabot'
            const staleLabel = 'status: stale'
            const {owner, repo} = context.repo
            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              creator: 'dependabot[bot]',
              per_page: 100
            })

            for (const item of items) {
              if (!item.pull_request) continue

              const names = (item.labels || []).map(label => label.name)
              if (!names.includes(exemptLabel)) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: item.number,
                  labels: [exemptLabel]
                })
                core.info(`#${item.number}: added ${exemptLabel}`)
              }

              if (names.includes(staleLabel)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: item.number,
                    name: staleLabel
                  })
                  core.info(`#${item.number}: removed ${staleLabel}`)
                } catch (error) {
                  const status = error.status || (error.response && error.response.status)
                  if (status !== 404) throw error
                }
              }
            }
      - uses: actions/stale@v7
        with:
          days-before-stale: 20
          days-before-close: 5
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
          stale-issue-label: 'status: stale'
          stale-pr-label: 'status: stale'
          exempt-issue-labels: 'pinned,security,status: pinned,type: security'
          exempt-pr-labels: 'pinned,security,status: pinned,type: security,dependabot'
